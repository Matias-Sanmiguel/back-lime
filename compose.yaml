services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lime_SA_2026!}
    ports:
      - "1433:1433"
    volumes:
      - lime-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lime_SA_2026!}
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'lime') IS NULL CREATE DATABASE [lime]"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    environment:
      SPRING_APPLICATION_NAME: lime
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=lime;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:-Lime_SA_2026!}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.microsoft.sqlserver.jdbc.SQLServerDriver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_OPEN_IN_VIEW: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      JWT_SECRET: ${JWT_SECRET:-Lime-Dev-Only-Secret-Key-Please-Override-In-Prod-2026!}
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/lime-uploads}
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/properties || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  lime-sqlserver-data:
