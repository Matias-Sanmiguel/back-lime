spring.application.name=lime
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=lime;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${MSSQL_SA_PASSWORD:Lime_SA_2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=10
spring.mvc.problemdetails.enabled=true
# Los mensajes de validación (@NotBlank, @Size, ...) salen en español sin importar el
# Accept-Language del cliente, igual que el resto de los errores de la API.
spring.web.locale=es
spring.web.locale-resolver=fixed

# JWT_SECRET: en producción se define SIEMPRE por variable de entorno. El valor por defecto de
# abajo es solo para desarrollo (es público: está en el repo) y no debe usarse en producción.
# Mínimo 32 caracteres. Ver README.md, sección "Configuración (variables de entorno)".
jwt.secret=${JWT_SECRET:Lime-Dev-Only-Secret-Key-Please-Override-In-Prod-2026!}
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAMESITE:Lax}